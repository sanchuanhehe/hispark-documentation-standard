version: 1

project:
  title: HiSpark 文档规范
  subtitle: 基于 Diátaxis 的 SDK 文档设计、质量与治理要求
  description: HiSpark SDK 类项目的文档信息架构、创作、验证、Review、CI 与持续维护规范。
  authors:
    - name: HiSpark 文档规范维护者
  keywords:
    - HiSpark
    - Diátaxis
    - documentation
    - MyST
    - LaTeX
  date: 2026-09-10
  settings:
    myst_to_tex:
      code_style: listings
  exclude:
    - .agents/**
    - README.md
    - latex/**
    - profiles/**
    - scripts/**
    - node_modules/**
    - exports/**
  toc:
    - file: docs/index.md
    - file: docs/part-1-foundations/04-core-principles.md
    - file: docs/handbook/write-a-page.md
    - title: 写作与专项：按内容查阅
      children:
        - file: docs/part-2-authoring/05-information-architecture.md
        - file: docs/part-2-authoring/06-authoring.md
        - file: docs/part-2-authoring/07-upstream-downstream.md
        - file: docs/part-2-authoring/08-specialized-content.md
    - title: 审查与验证：处理本次变更
      children:
        - file: docs/part-3-quality/09-validation-and-testing.md
        - file: docs/part-3-quality/10-review-and-merge.md
        - file: docs/part-4-governance/14-conformance-checklist.md
    - title: 项目维护：负责人查阅
      children:
        - file: docs/part-3-quality/11-daily-ci.md
        - file: docs/part-4-governance/12-governance-and-maintenance.md
        - file: docs/part-4-governance/13-migration.md
    - title: 规范依据与阅读说明
      children:
        - file: docs/preface.md
        - file: docs/part-1-foundations/01-scope-and-purpose.md
        - file: docs/part-1-foundations/02-normative-language.md
        - file: docs/part-1-foundations/03-terminology.md
        - file: docs/backmatter/15-references.md
        - file: docs/backmatter/appendix-a-directory-mapping.md
  exports:
    - id: standard-pdf
      format: pdf
      template: ./latex/plain_latex_book_zh
      output: exports/hispark-documentation-standard.pdf
      title: HiSpark 文档规范
      subtitle: 基于 Diátaxis 的 SDK 文档设计、质量与治理要求
      articles: &book-articles
        - file: docs/preface.md
          level: 0
        - file: docs/part-1-foundations/01-scope-and-purpose.md
          level: 0
        - file: docs/part-1-foundations/02-normative-language.md
          level: 0
        - file: docs/part-1-foundations/03-terminology.md
          level: 0
        - file: docs/part-1-foundations/04-core-principles.md
          level: 0
        - file: docs/part-2-authoring/05-information-architecture.md
          level: 0
        - file: docs/part-2-authoring/06-authoring.md
          level: 0
        - file: docs/part-2-authoring/07-upstream-downstream.md
          level: 0
        - file: docs/part-2-authoring/08-specialized-content.md
          level: 0
        - file: docs/part-3-quality/09-validation-and-testing.md
          level: 0
        - file: docs/part-3-quality/10-review-and-merge.md
          level: 0
        - file: docs/part-3-quality/11-daily-ci.md
          level: 0
        - file: docs/part-4-governance/12-governance-and-maintenance.md
          level: 0
        - file: docs/part-4-governance/13-migration.md
          level: 0
        - file: docs/part-4-governance/14-conformance-checklist.md
          level: 0
        - file: docs/backmatter/15-references.md
          level: 0
        - file: docs/backmatter/appendix-a-directory-mapping.md
          level: 0
        - file: docs/handbook/write-a-page.md
          level: 0
    - id: standard-tex
      format: tex
      template: ./latex/plain_latex_book_zh
      output: exports/hispark-documentation-standard-tex.zip
      title: HiSpark 文档规范
      subtitle: 基于 Diátaxis 的 SDK 文档设计、质量与治理要求
      articles: *book-articles
  downloads:
    - id: standard-pdf
      title: 下载 PDF 版本
    - id: standard-tex
      title: 下载 LaTeX 源文件

site:
  template: book-theme
  title: HiSpark 文档规范
  options:
    logo_text: HiSpark 文档规范
