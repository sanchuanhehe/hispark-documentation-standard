name: Documentation Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: /${{ github.event.repository.name }}/dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r requirements-pdf.txt
      - name: Validate both profiles and all tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build/pages-evidence
          npm run check 2>&1 | tee _build/pages-evidence/check.log
          python -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee _build/pages-evidence/tests.log
      - name: Build and check deployable HTML
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_pages.py 2>&1 | tee _build/pages-evidence/build.log
      - name: Assemble immutable releases and dev
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail
          mv _build/pages _build/pages-dev
          python scripts/assemble_pages.py --repo "$REPOSITORY" --base-url "/$REPOSITORY_NAME" 2>&1 | tee _build/pages-evidence/assemble.log
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/pages-evidence/
            _build/pages/build-manifest.json
            _build/pages/deployment-manifest.json
            _build/pages/versions.json
          if-no-files-found: error
      - name: Upload verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _build/pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
